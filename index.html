<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reel 16:9 TV Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Top Controls Bar */
    .controls {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 10px 14px;
      background: rgba(12, 12, 12, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 100;
      border-bottom: 1px solid #222;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .controls.hidden {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      font-size: 15px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #181818;
      color: #fff;
      outline: none;
    }

    button {
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid #333;
      background: #252525;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }

    button.primary {
      background: #e1306c;
      border-color: #e1306c;
    }

    button:focus, button:hover {
      background: #333;
      outline: 2px solid #fff;
    }

    .menu-trigger {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 90;
      opacity: 0.35;
      padding: 8px 12px;
      font-size: 12px;
    }

    .menu-trigger:hover, .menu-trigger:focus {
      opacity: 1;
    }

    /* Centered Viewport */
    #stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    #frame-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-origin: center center;
    }

    #reelFrame {
      width: 540px;
      height: 1000px;
      border: none;
      background: #000;
      display: block;
    }
  </style>
</head>
<body>

  <button class="menu-trigger" onclick="toggleMenu(false)">Menu</button>

  <div class="controls" id="controlBar">
    <input 
      type="text" 
      id="reelInput" 
      placeholder="Paste Instagram Reel link..." 
      onkeydown="if(event.key === 'Enter') loadReel()"
    />
    <button class="primary" onclick="loadReel()">Play</button>
    <button onclick="nudge(-30)">▲ Up</button>
    <button onclick="nudge(30)">▼ Down</button>
    <button onclick="resetPosition()">Reset</button>
    <button onclick="toggleMenu(true)">Hide Bar</button>
  </div>

  <div id="stage">
    <div id="frame-wrapper">
      <iframe id="reelFrame" src="about:blank" allowfullscreen="true" scrolling="no"></iframe>
    </div>
  </div>

  <script>
    const BASE_WIDTH = 540;
    let verticalOffset = -35; // Default compensation for Instagram's top header

    function updateTransform() {
      const wrapper = document.getElementById('frame-wrapper');
      const screenWidth = window.innerWidth;
      
      // Scale factor to fill 100% of TV width
      const scale = screenWidth / BASE_WIDTH;
      
      wrapper.style.transform = `translate(-50%, calc(-50% + ${verticalOffset}px)) scale(${scale})`;
    }

    function nudge(pixels) {
      verticalOffset += pixels;
      updateTransform();
    }

    function resetPosition() {
      verticalOffset = -35;
      updateTransform();
    }

    function extractReelId(url) {
      const match = url.trim().match(/(?:reel|reels|p)\/([A-Za-z0-9_-]+)/);
      return match ? match[1] : null;
    }

    function loadReel() {
      const rawUrl = document.getElementById('reelInput').value;
      const reelId = extractReelId(rawUrl);

      if (!reelId) {
        alert('Invalid Instagram link');
        return;
      }

      document.getElementById('reelFrame').src = `https://www.instagram.com/reel/${reelId}/embed/`;
      toggleMenu(true);
      updateTransform();
    }

    function toggleMenu(hide) {
      const bar = document.getElementById('controlBar');
      if (hide) {
        bar.classList.add('hidden');
      } else {
        bar.classList.remove('hidden');
      }
    }

    window.addEventListener('resize', updateTransform);

    window.addEventListener('DOMContentLoaded', () => {
      updateTransform();
      const params = new URLSearchParams(window.location.search);
      const passedUrl = params.get('url');
      if (passedUrl) {
        document.getElementById('reelInput').value = passedUrl;
        loadReel();
      }
    });
  </script>

</body>
</html>
