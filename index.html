<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reel 16:9 TV Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Floating Top Bar */
    .controls {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 12px 16px;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      gap: 10px;
      z-index: 100;
      border-bottom: 1px solid #222;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .controls.hidden {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #181818;
      color: #fff;
      outline: none;
    }

    button {
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid #333;
      background: #252525;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }

    button.primary {
      background: #e1306c;
      border-color: #e1306c;
    }

    .menu-trigger {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 90;
      opacity: 0.3;
      padding: 8px 12px;
      font-size: 12px;
    }

    .menu-trigger:hover, .menu-trigger:focus {
      opacity: 1;
    }

    /* Screen Stage */
    #stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    #reelFrame {
      position: absolute;
      border: none;
      background: #000;
      transform-origin: top left;
    }
  </style>
</head>
<body>

  <button class="menu-trigger" onclick="toggleMenu(false)">Menu</button>

  <div class="controls" id="controlBar">
    <input 
      type="text" 
      id="reelInput" 
      placeholder="Paste Instagram Reel link..." 
      onkeydown="if(event.key === 'Enter') loadReel()"
    />
    <button class="primary" onclick="loadReel()">Play</button>
    <button onclick="toggleMenu(true)">Hide Bar</button>
  </div>

  <div id="stage">
    <iframe id="reelFrame" src="about:blank" allowfullscreen="true" scrolling="no"></iframe>
  </div>

  <script>
    const BASE_WIDTH = 540;
    const HEADER_OFFSET = 56; // Crops out top Instagram bar

    function fitTo16x9() {
      const frame = document.getElementById('reelFrame');
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;

      // Scale factor to fill width
      const scale = screenWidth / BASE_WIDTH;

      frame.style.width = BASE_WIDTH + 'px';
      // Height covers the 16:9 video + header offset + buffer
      frame.style.height = (BASE_WIDTH * (9 / 16) + HEADER_OFFSET + 300) + 'px';
      
      // Scale and pull up by the header height so video aligns to top (0,0)
      frame.style.transform = `scale(${scale}) translateY(-${HEADER_OFFSET}px)`;
    }

    function extractReelId(url) {
      const match = url.trim().match(/(?:reel|reels|p)\/([A-Za-z0-9_-]+)/);
      return match ? match[1] : null;
    }

    function loadReel() {
      const rawUrl = document.getElementById('reelInput').value;
      const reelId = extractReelId(rawUrl);

      if (!reelId) {
        alert('Invalid Instagram link');
        return;
      }

      document.getElementById('reelFrame').src = `https://www.instagram.com/reel/${reelId}/embed/`;
      toggleMenu(true);
      fitTo16x9();
    }

    function toggleMenu(hide) {
      const bar = document.getElementById('controlBar');
      if (hide) {
        bar.classList.add('hidden');
      } else {
        bar.classList.remove('hidden');
      }
    }

    window.addEventListener('resize', fitTo16x9);

    window.addEventListener('DOMContentLoaded', () => {
      fitTo16x9();
      const params = new URLSearchParams(window.location.search);
      const passedUrl = params.get('url');
      if (passedUrl) {
        document.getElementById('reelInput').value = passedUrl;
        loadReel();
      }
    });
  </script>

</body>
</html>
