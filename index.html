<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reel 16:9 TV Player</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: rgba(20, 20, 20, 0.92);
      --accent: #e1306c;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Top Control Bar (Hides during playback) */
    .controls {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 14px 20px;
      background: var(--panel);
      backdrop-filter: blur(8px);
      display: flex;
      gap: 10px;
      z-index: 100;
      border-bottom: 1px solid #262626;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .controls.hidden {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #3a3a3a;
      background: #141414;
      color: var(--text);
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid #333;
      background: #222;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
    }

    button.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    button:focus, button:hover {
      filter: brightness(1.2);
      outline: 2px solid #fff;
    }

    /* Floating button to restore hidden menu */
    .menu-trigger {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 90;
      opacity: 0.25;
      padding: 8px 12px;
      font-size: 13px;
    }

    .menu-trigger:hover, .menu-trigger:focus {
      opacity: 1;
    }

    /* Viewport Masking Modes */
    .stage {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }

    /* Mode 1: 16:9 Native (Crops top header & bottom footer) */
    .stage.mode-16-9 {
      width: 100vw;
      height: 100vh;
    }
    .stage.mode-16-9 iframe {
      width: 100vw;
      height: calc(100vh + 220px);
      margin-top: 100px; /* Pushes footer off-screen while cropping top header */
    }

    /* Mode 2: 16:9 De-Letterbox (Zooms in on 16:9 video stuck inside a 9:16 frame) */
    .stage.mode-zoom {
      width: 100vw;
      height: 100vh;
    }
    .stage.mode-zoom iframe {
      width: 56.25vh; /* Base 9:16 width */
      height: calc(100vh + 210px);
      margin-top: 95px;
      transform: scale(1.78); /* 16/9 = 1.777x zoom to fill horizontal TV */
      transform-origin: center center;
    }

    /* Mode 3: Standard 9:16 Vertical Pillar */
    .stage.mode-9-16 {
      width: 420px;
      height: 92vh;
      border-radius: 12px;
    }
    .stage.mode-9-16 iframe {
      width: 100%;
      height: calc(100% + 200px);
      margin-top: 90px;
    }

    iframe {
      border: none;
      background: #000;
    }
  </style>
</head>
<body>

  <button class="menu-trigger" onclick="toggleMenu(false)">Menu</button>

  <div class="controls" id="controlBar">
    <input 
      type="text" 
      id="reelInput" 
      placeholder="Paste Instagram Reel link here..." 
      onkeydown="if(event.key === 'Enter') loadReel()"
    />
    <button class="primary" onclick="loadReel()">Play</button>
    <button id="btn-16-9" class="active" onclick="setMode('mode-16-9', this)">16:9 Fit</button>
    <button id="btn-zoom" onclick="setMode('mode-zoom', this)">16:9 Zoom</button>
    <button id="btn-9-16" onclick="setMode('mode-9-16', this)">9:16 Vertical</button>
    <button onclick="toggleMenu(true)">Hide Bar</button>
  </div>

  <div class="stage mode-16-9" id="playerStage">
    <iframe id="reelFrame" src="about:blank" allowfullscreen="true" scrolling="no"></iframe>
  </div>

  <script>
    function extractReelId(url) {
      const match = url.trim().match(/(?:reel|reels|p)\/([A-Za-z0-9_-]+)/);
      return match ? match[1] : null;
    }

    function loadReel() {
      const rawUrl = document.getElementById('reelInput').value;
      const reelId = extractReelId(rawUrl);

      if (!reelId) {
        alert('Invalid Instagram Reel URL.');
        return;
      }

      const embedUrl = `https://www.instagram.com/reel/${reelId}/embed/`;
      document.getElementById('reelFrame').src = embedUrl;
    }

    function setMode(modeClass, btnElement) {
      const stage = document.getElementById('playerStage');
      stage.className = 'stage ' + modeClass;

      document.querySelectorAll('.controls button:not(.primary)').forEach(b => b.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
    }

    function toggleMenu(hide) {
      const bar = document.getElementById('controlBar');
      if (hide) {
        bar.classList.add('hidden');
      } else {
        bar.classList.remove('hidden');
      }
    }

    // Support passing URL directly via query parameter: ?url=https://...
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const passedUrl = params.get('url');
      if (passedUrl) {
        document.getElementById('reelInput').value = passedUrl;
        loadReel();
      }
    });
  </script>

</body>
</html>
